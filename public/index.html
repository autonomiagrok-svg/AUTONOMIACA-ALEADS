<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AutonomIA Systems — Caça Leads</title>
  <meta name="theme-color" content="#0b132b" />
  <link rel="stylesheet" href="/tokens.css" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app" id="appRoot">
    <aside class="sidebar">
      <div class="brand">
        <img class="brand-logo" src="/logo-autonomia.png" alt="AutonomIA Systems" />
        <strong id="brandName">AutonomIA Systems</strong>
        <span id="brandSlogan">Sistemas Inteligentes · Caça Leads</span>
      </div>
      <div class="profile-box">
        <label for="operatorProfile" class="profile-label">👤 Operador Ativo:</label>
        <select id="operatorProfile" class="profile-select">
          <option value="Rafael Oliveira">Rafael Oliveira</option>
          <option value="Sara Rosseto">Sara Rosseto</option>
        </select>
        <span class="profile-badge" id="profileBadge">Especialista em Sistemas</span>
      </div>
      <nav>
        <button class="nav active" data-view="dashboard">Painel</button>
        <button class="nav" data-view="leads">Leads</button>
        <button class="nav" data-view="agenda">📅 Agenda do Dia <span id="agendaBadge" class="nav-badge hidden">0</span></button>
        <button class="nav" data-view="dialer">📞 Power Dialer</button>
        <button class="nav" data-view="intelligence">🧠 Inteligência</button>
        <button class="nav" data-view="motor">⚡ Motor de Busca</button>
        <button class="nav" data-view="pipeline">Pipeline</button>
        <button class="nav" data-view="templates">💬 Mensagens & Scripts</button>
        <button class="nav" data-view="novo">Novo lead</button>
        <button class="nav" data-view="pesquisa">Pesquisa & fontes</button>
      </nav>
      <div class="side-foot">
        <p>Inteligência comercial e automação de processos B2B.</p>
        <button class="btn block" id="importCsvButton" type="button">Importar CSV</button>
        <input id="importCsvFile" type="file" accept=".csv,text/csv" hidden />
        <button class="btn block" id="exportCsvButton" type="button">Exportar CSV</button>
      </div>
    </aside>
    <main>
      <header class="top">
        <div>
          <h1 id="title">Painel</h1>
          <p class="muted" id="subtitle">AutonomIA Systems · Sistemas Inteligentes</p>
        </div>
        <div class="top-actions">
          <div id="operationalStatusBar" class="operational-status-bar">
            <span id="networkStatusPill" class="status-pill online">🟢 Online</span>
            <span id="ephemeralStorageBadge" class="status-pill ephemeral hidden">⚠️ Disco efêmero (faça Backup JSON)</span>
          </div>
          <button type="button" class="btn" id="uiModeToggle">🧠 Modo: Estratégico</button>
          <div class="top-user-indicator">
            <span class="pulse-dot"></span>
            <span id="activeOperatorDisplay">Operando: <strong>Rafael Oliveira</strong></span>
          </div>
          <input id="search" class="search" placeholder="Buscar lead..." />
        </div>
      </header>
      <div id="view" aria-live="polite"></div>
    </main>
  </div>
  <div id="modal" class="modal hidden"></div>
  <div id="dialogModal" class="modal hidden"></div>
  <script type="module">
    import * as Hygiene from '/shared/hygiene.js';
    import * as DomainSignals from '/shared/domain_signals.js';
    import * as ScoringModes from '/shared/scoring_modes.js';
    import * as CopyEngine from '/shared/copy_engine.js';
    import * as CadenceEngine from '/shared/cadence_engine.js';
    import * as RelationshipAnalytics from '/shared/relationship_analytics.js';
    import * as EmpiricalCalibrator from '/shared/empirical_calibrator.js';
    import * as TerritoryEngine from '/shared/territory_engine.js';
    import * as ValueMatrix from '/shared/value_matrix.js';
    window.Hygiene = Hygiene;
    window.DomainSignals = DomainSignals;
    window.ScoringModes = ScoringModes;
    window.CopyEngine = CopyEngine;
    window.CadenceEngine = CadenceEngine;
    window.RelationshipAnalytics = RelationshipAnalytics;
    window.EmpiricalCalibrator = EmpiricalCalibrator;
    window.TerritoryEngine = TerritoryEngine;
    window.ValueMatrix = ValueMatrix;
  </script>
  <script src="/js/runtime_adapter.js"></script>
  <script src="/js/ports/config.js"></script>
  <script src="/js/ports/input_adapter.js"></script>
  <script src="/js/ports/output_actions.js"></script>
  <script src="/js/motor-maps.js"></script>
  <script src="/js/classifier-ui.js"></script>
  <script src="/js/power-dialer.js"></script>
  <script src="/js/agenda-ui.js"></script>
  <script src="/js/intelligence-ui.js"></script>
  <script src="/app.js"></script>
</body>
</html>
